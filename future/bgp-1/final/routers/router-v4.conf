# BIRD Configuration for Router V4 (AS10204)
# If we run BIRD interactively, we can see logs go by for everything
# it's doing
debug protocols all;

# Learn what interfaces exist on this machine and also their up/down status
protocol device {
  scan time 10;
}

# Adds interface route information to BIRD's routing table
protocol direct {
  ipv4;
  interface "*";
}

protocol kernel {
  ipv4 {
    # "import" takes routes from the machine's routing table
    # and then brings them into bird as static routes
    import none;

    # "export" takes routes that BIRD has learned from other sources (e.g. BGP)
    # and propagates them into the machine's routing table
    export all;
  };
}


# BGP peering with AS208 (Zayo)
protocol bgp bgp_z8 {
  local 2.8.0.4 as 10204;
  neighbor 2.8.0.8 as 208;

  ipv4 {
    import all;
    export all;
  };
}

# BGP peering with AS10002 (ISC)
protocol bgp bgp_i2 {
  local 2.8.0.4 as 10204;
  neighbor 2.8.0.2 as 10002;

  ipv4 {
    import all;
    export all;
  };
}

# BGP peering with AS803 (Google)
protocol bgp bgp_g3 {
  local 2.8.0.4 as 10204;
  neighbor 2.8.0.3 as 803;

  ipv4 {
    import all;
    export all;
  };
}
