# BIRD Configuration for Router T5 (AS305)
# If we run BIRD interactively, we can see logs go by for everything
# it's doing
debug protocols all;

# Learn what interfaces exist on this machine and also their up/down status
protocol device {
  scan time 10;
}

# Adds interface route information to BIRD's routing table
protocol direct {
  ipv4;
  interface "*";
}

protocol kernel {
  ipv4 {
    # "import" takes routes from the machine's routing table
    # and then brings them into bird as static routes
    import none;

    # "export" takes routes that BIRD has learned from other sources (e.g. BGP)
    # and propagates them into the machine's routing table
    export all;
  };
}


# BGP peering with AS207 (Zayo)
protocol bgp bgp_z7 {
  local 2.3.0.5 as 305;
  neighbor 2.3.0.7 as 207;

  ipv4 {
    import all;
    export all;
  };
}

# BGP peering with AS306 (Telia)
protocol bgp bgp_t6 {
  local 3.5.6.5 as 305;
  neighbor 3.5.6.6 as 306;

  ipv4 {
    import all;
    export all;
  };
}

# BGP peering with AS307 (Telia)
protocol bgp bgp_t7 {
  local 3.5.7.5 as 305;
  neighbor 3.5.7.7 as 307;

  ipv4 {
    import all;
    export all;
  };
}

# BGP peering with AS308 (Telia)
protocol bgp bgp_t8 {
  local 3.5.8.5 as 305;
  neighbor 3.5.8.8 as 308;

  ipv4 {
    import all;
    export all;
  };
}
