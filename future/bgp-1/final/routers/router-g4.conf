# BIRD Configuration for Router G4 (AS804)
# If we run BIRD interactively, we can see logs go by for everything
# it's doing
debug protocols all;

# Learn what interfaces exist on this machine and also their up/down status
protocol device {
  scan time 10;
}

# Adds interface route information to BIRD's routing table
protocol direct {
  ipv4;
  interface "*";
}

protocol kernel {
  ipv4 {
    # "import" takes routes from the machine's routing table
    # and then brings them into bird as static routes
    import none;

    # "export" takes routes that BIRD has learned from other sources (e.g. BGP)
    # and propagates them into the machine's routing table
    export all;
  };
}


# BGP peering with AS802 (Google)
protocol bgp bgp_g2 {
  local 8.1.0.4 as 804;
  neighbor 8.1.0.2 as 802;

  ipv4 {
    import all;
    export all;
  };
}

# BGP peering with AS308 (Telia)
protocol bgp bgp_t8 {
  local 3.8.0.4 as 804;
  neighbor 3.8.0.8 as 308;

  ipv4 {
    import all;
    export all;
  };
}

# BGP peering with AS10002 (ISC)
protocol bgp bgp_i2 {
  local 3.8.0.4 as 804;
  neighbor 3.8.0.2 as 10002;

  ipv4 {
    import all;
    export all;
  };
}
