# BIRD Configuration for Router N2 (AS10102)
# If we run BIRD interactively, we can see logs go by for everything
# it's doing
debug protocols all;

# Learn what interfaces exist on this machine and also their up/down status
protocol device {
  scan time 10;
}

# Adds interface route information to BIRD's routing table
protocol direct {
  ipv4;
  interface "*";
}

protocol kernel {
  ipv4 {
    # "import" takes routes from the machine's routing table
    # and then brings them into bird as static routes
    import none;

    # "export" takes routes that BIRD has learned from other sources (e.g. BGP)
    # and propagates them into the machine's routing table
    export all;
  };
}


# BGP peering with AS207 (Zayo)
protocol bgp bgp_z7 {
  local 2.4.0.2 as 10102;
  neighbor 2.4.0.7 as 207;

  ipv4 {
    import all;
    export all;
  };
}

# BGP peering with AS404 (AWS)
protocol bgp bgp_a4 {
  local 2.4.0.2 as 10102;
  neighbor 2.4.0.4 as 404;

  ipv4 {
    import all;
    export all;
  };
}

# BGP peering with AS307 (Telia)
protocol bgp bgp_t7 {
  local 3.4.0.2 as 10102;
  neighbor 3.4.0.7 as 307;

  ipv4 {
    import all;
    export all;
  };
}

# BGP peering with AS403 (AWS)
protocol bgp bgp_a3 {
  local 3.4.0.2 as 10102;
  neighbor 3.4.0.3 as 403;

  ipv4 {
    import all;
    export all;
  };
}
