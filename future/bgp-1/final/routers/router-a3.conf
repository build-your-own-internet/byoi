# BIRD Configuration for Router A3 (AS403)
# If we run BIRD interactively, we can see logs go by for everything
# it's doing
debug protocols all;

# Learn what interfaces exist on this machine and also their up/down status
protocol device {
  scan time 10;
}

# Adds interface route information to BIRD's routing table
protocol direct {
  ipv4;
  interface "*";
}

protocol kernel {
  ipv4 {
    # "import" takes routes from the machine's routing table
    # and then brings them into bird as static routes
    import none;

    # "export" takes routes that BIRD has learned from other sources (e.g. BGP)
    # and propagates them into the machine's routing table
    export all;
  };
}


# BGP peering with AS402 (AWS)
protocol bgp bgp_a2 {
  local 4.1.0.3 as 403;
  neighbor 4.1.0.2 as 402;

  ipv4 {
    import all;
    export all;
  };
}

# BGP peering with AS404 (AWS)
protocol bgp bgp_a4 {
  local 4.1.0.3 as 403;
  neighbor 4.1.0.4 as 404;

  ipv4 {
    import all;
    export all;
  };
}

# BGP peering with AS307 (Telia)
protocol bgp bgp_t7 {
  local 3.4.0.3 as 403;
  neighbor 3.4.0.7 as 307;

  ipv4 {
    import all;
    export all;
  };
}

# BGP peering with AS10102 (Netnod)
protocol bgp bgp_n2 {
  local 3.4.0.3 as 403;
  neighbor 3.4.0.2 as 10102;

  ipv4 {
    import all;
    export all;
  };
}
