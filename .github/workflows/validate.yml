name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: cd web && bun install

      - name: TypeScript check
        run: cd web && bun run typecheck

      - name: Build site
        run: cd web && bun run build

      - name: Smoke test
        run: cd web && bun run test

      # celilo/scripts holds the module hooks (publish, health_check). Separate
      # package from web/, so it needs its own install. celilo/e2e is NOT run
      # here — it needs the sealed network.
      - name: Celilo hook tests
        run: cd celilo/scripts && bun install --frozen-lockfile && bun test
